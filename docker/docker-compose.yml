services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: propnest_frontend
    ports:
      - "3000:3000"
    environment:
      # Defaults to host.docker.internal so this works out of the box when
      # propnest-api is running standalone on your host via its own
      # docker-compose. Override with a real URL if the API is deployed
      # elsewhere, or point it at another container on a shared network.
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
      - NODE_ENV=development
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      propnest_network:
        aliases:
          - propnest.frontend.ui
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  e2e:
    build:
      context: ..
      dockerfile: docker/Dockerfile.e2e
    container_name: propnest_e2e
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - PLAYWRIGHT_BASE_URL=http://propnest.frontend.ui:3000
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/playwright-report
      - /app/test-results
    networks:
      propnest_network: {}

networks:
  propnest_network:
    driver: bridge
